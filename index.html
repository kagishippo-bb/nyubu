<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="あなたの猫を、カギしっぽバスケ部に。Threads のコメントに写真をはってくれたら、ドラがまんがの絵で部員証を描きます。">
<meta property="og:title" content="うちの子 入部届｜カギしっぽバスケ部">
<meta property="og:description" content="写真をはってくれたら、ドラがまんがの絵で部員証を描きます🐾">
<meta property="og:image" content="https://kagishippo-bb.github.io/nyubu/og.png">
<meta name="twitter:card" content="summary_large_image">
<title>うちの子 入部届｜カギしっぽバスケ部</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Yomogi&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF8EC;--paper:#FFFFFF;--ink:#3A2412;--line:#5A3A1E;--orange:#F2A65A;--deep:#C9742E;--mute:#8A7563}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;line-height:1.7}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
.card{background:var(--paper);border:3px solid var(--line);border-radius:22px;overflow:hidden}
.head{background:var(--orange);color:#fff;text-align:center;padding:14px 10px;border-bottom:3px solid var(--line)}
.head small{display:block;font-weight:700;font-size:15px}
.head b{font-size:30px;font-weight:900;letter-spacing:.2em}
.body{padding:18px 18px 22px}
h2{font-size:20px;margin:6px 0 10px;text-align:center}
ol{padding-left:1.4em;margin:10px 0 16px}
li{margin:8px 0;font-weight:700;word-break:keep-all;overflow-wrap:anywhere}
li span{display:block;font-weight:500;color:var(--mute);font-size:14px}
.btn{display:block;text-align:center;background:var(--line);color:#fff;text-decoration:none;font-weight:900;font-size:18px;border-radius:999px;padding:14px;margin:16px 0 10px}
.sub{display:block;text-align:center;color:var(--deep);font-weight:700;text-decoration:none;padding:8px}
.note{font-size:13px;color:var(--mute);text-align:center;margin-top:6px}
img{display:block;width:72%;max-width:300px;margin:6px auto 4px;border-radius:12px}
.dora{font-family:Yomogi,sans-serif;text-align:center;font-size:17px;margin:4px 0 10px}
footer{text-align:center;color:var(--mute);font-size:13px;margin-top:18px}
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="head"><small>カギしっぽバスケ部</small><b>入部届</b></div>
    <div class="body">
      <h2>入部の受付は、Threads のコメントで🐾</h2>
      <ol>
        <li>Threads の @kagishippo_basket の投稿に、猫の写真と名前をコメント<span>くせや、とくい技があれば、ひとことだけ（なくても大丈夫です）</span></li>
        <li>ドラが、その子をまんがの絵で描いて、部員証をプレゼント<span>1週間に先着5匹まで。部員番号は入部した順です</span></li>
        <li>入部した子は、12月の大会の客席にも描かれます</li>
      </ol>
      <img src="mihon.png" alt="部員証の見本（ドラ）">
      <p class="dora">「…入部を、みとめる」</p>
      <a class="btn" href="https://www.threads.com/@kagishippo_basket">Threads をひらく</a>
      <a class="sub" href="https://kagishippo-bb.github.io/nyubu/yomu/">まんがを1話から読む</a>
      <p class="note">絵にして紹介してもよいか、先にお聞きします。</p>
    </div>
  </div>
  <footer>カギしっぽバスケ部</footer>
</main>
<script data-goatcounter="https://kagishippo.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
